name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run host tests
        run: bash tools/run_host_tests.sh

  firmware-build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment:
          - sticky-salah-release
          - sticky-salah-debug
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'src/idf_component.yml') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Upload release firmware
        if: matrix.environment == 'sticky-salah-release'
        uses: actions/upload-artifact@v4
        with:
          name: inksalah-firmware-${{ github.sha }}
          path: .pio/build/sticky-salah-release/firmware.bin
          if-no-files-found: error
          retention-days: 14
